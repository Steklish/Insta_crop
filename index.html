<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>InstaCrop - Blurred Background Canvas Studio</title>
    <meta name="description" content="Turn any photo into gorgeous Instagram posts, Stories, and Reels with aesthetic blurred background padding and custom aspect ratios." />
    
    <script>
      // Ensure trailing slash on GitHub Pages so relative resources (manifest, Service Worker) resolve within repository scope
      if (window.location.pathname && !window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
    </script>

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#1c1c1e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InstaCrop" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body class="bg-[#1c1c1e] text-[#e1e1e0] antialiased overflow-x-hidden selection:bg-[#a9967f] selection:text-[#1c1c1e]">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
