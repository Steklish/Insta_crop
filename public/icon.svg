<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid blur lines for aesthetics -->
  <g opacity="0.25">
    <circle cx="160" cy="160" r="90" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="360" cy="340" r="110" fill="#38bdf8" filter="url(#softGlow)" />
  </g>

  <!-- Outer Canvas Frame (Blurred background indicator) -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="#0f172a" fill-opacity="0.45" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />

  <!-- Inner Picture Frame (Foreground cropped preview) -->
  <rect x="144" y="144" width="224" height="224" rx="28" fill="#1e293b" fill-opacity="0.9" stroke="#ffffff" stroke-width="6" />

  <!-- Sun -->
  <circle cx="204" cy="204" r="22" fill="#facc15" />

  <!-- Mountain Peak 1 -->
  <path d="M168 336 L240 248 L288 300 L336 236 L360 336 Z" fill="#6366f1" />
  <!-- Mountain Peak 2 (accent) -->
  <path d="M228 336 L276 268 L320 336 Z" fill="#a855f7" opacity="0.9" />

  <!-- Crop Corner Accents -->
  <path d="M128 176 V128 H176" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M384 176 V128 H336" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M128 336 V384 H176" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M384 336 V384 H336" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
